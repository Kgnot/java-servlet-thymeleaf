plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'  // ← Plugin para Fat JAR
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Configuración del Shadow JAR (Fat JAR)
shadowJar {
    archiveBaseName.set('app-jetty')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes(
                'Main-Class': 'org.server.Main'
        )
    }
    mergeServiceFiles()  // Importante para evitar conflictos
}

// Hacer que build dependa de shadowJar
build.dependsOn shadowJar

application {
    mainClass = 'org.server.Main'
}

group = 'org.server'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Hibernate + JPA + Hikari
    implementation 'org.hibernate.orm:hibernate-core:6.6.1.Final'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation "org.hibernate.orm:hibernate-hikaricp:6.6.1.Final"
    // PostgreSQL driver
    implementation 'org.postgresql:postgresql:42.7.3'
    // Reflection
    implementation 'org.reflections:reflections:0.10.2'
    // Websocket con Jetty
    implementation 'org.eclipse.jetty.ee11:jetty-ee11-servlet:12.1.1'
    implementation 'jakarta.websocket:jakarta.websocket-api:2.2.0'
    implementation 'org.eclipse.jetty.ee11.websocket:jetty-ee11-websocket-jakarta-server:12.1.1'
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.2'
    // LOGGER - cambiar a implementation para que se incluya en el JAR
    implementation 'org.slf4j:slf4j-simple:2.0.16'  // ← Cambio importante
}

test {
    useJUnitPlatform()
}